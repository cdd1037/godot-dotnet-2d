name: Windows .NET CI

on:
  push:
    branches: ['**']
    tags: ['v*-custom.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_PROCESSOR_COUNT: '4'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  checks:
    name: Static and shader generator checks
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      build: ${{ steps.checks.outputs.build }}
      full: ${{ steps.checks.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install Python style checker
        run: python -m pip install ruff==0.15.8
      - name: Check tracked sources and CI scripts
        id: checks
        run: python .github/ci/checks.py
      - name: Lint workflow
        run: python .github/ci/install_tool.py actionlint
      - name: Check CI helper tests
        run: |
          python -m unittest discover -s .github/ci -p 'test_*.py' -v
          python -m unittest discover -s misc/android_dotnet_validation -p 'test_*.py' -v

  build:
    name: Windows x64 MSVC editor and .NET
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.ci-nuget-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
      DOTNET_CLI_HOME: ${{ github.workspace }}/.ci-dotnet-home
      PACKAGE_BUILD: ${{ needs.checks.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.401'
      - name: Install pinned build dependencies and select .NET 10
        id: prepare
        run: |
          python -m pip install scons==4.10.1
          python .github/ci/pipeline.py prepare
      - name: Restore editor build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .scons-cache/editor
          key: windows-2022-${{ steps.prepare.outputs.image }}-x64-msvc143-editor-speed-dotnet10-v1-${{ hashFiles('SConstruct', 'platform/windows/detect.py', '.github/ci/*.py', '.github/ci/smoke/*') }}-${{ github.sha }}
          restore-keys: windows-2022-${{ steps.prepare.outputs.image }}-x64-msvc143-editor-speed-dotnet10-v1-${{ hashFiles('SConstruct', 'platform/windows/detect.py', '.github/ci/*.py', '.github/ci/smoke/*') }}-
      - name: Build editor, generate matching glue and build local .NET packages
        run: python .github/ci/pipeline.py editor
      - name: Run .NET source generator tests and headless editor smoke
        run: python .github/ci/pipeline.py test
      - name: Save editor cache on default branch only
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .scons-cache/editor
          key: windows-2022-${{ steps.prepare.outputs.image }}-x64-msvc143-editor-speed-dotnet10-v1-${{ hashFiles('SConstruct', 'platform/windows/detect.py', '.github/ci/*.py', '.github/ci/smoke/*') }}-${{ github.sha }}
      - name: Restore release LTO template cache
        if: env.PACKAGE_BUILD == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .scons-cache/template
          key: windows-2022-${{ steps.prepare.outputs.image }}-x64-msvc143-extra-size-full-lto-v1-${{ hashFiles('SConstruct', 'platform/windows/detect.py', 'misc/build_profiles/windows_release_minimal_extra.py', '.github/ci/*.py', '.github/ci/smoke/*') }}-${{ github.sha }}
          restore-keys: windows-2022-${{ steps.prepare.outputs.image }}-x64-msvc143-extra-size-full-lto-v1-${{ hashFiles('SConstruct', 'platform/windows/detect.py', 'misc/build_profiles/windows_release_minimal_extra.py', '.github/ci/*.py', '.github/ci/smoke/*') }}-
      - name: Build only the final extra Release LTO template and verify LTCG
        if: env.PACKAGE_BUILD == 'true'
        run: python .github/ci/pipeline.py template
      - name: Export and run JIT, trimmed JIT and NativeAOT with the same LTO template
        if: env.PACKAGE_BUILD == 'true'
        run: python .github/ci/pipeline.py export
      - name: Validate experimental Android Mono trimmed managed payload
        if: env.PACKAGE_BUILD == 'true'
        run: |
          python misc/android_dotnet_validation/check_sdk_guards.py bin/ci-logs/android-sdk-guards
          python misc/android_dotnet_validation/run_publish_validation.py bin/ci-android-mono
      - name: Upload Android Mono publish evidence (not a device test or APK)
        if: always() && env.PACKAGE_BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-mono-publish-${{ github.sha }}
          path: |
            bin/ci-android-mono/*.json
            bin/ci-android-mono/*.log
            bin/ci-android-mono/*/publish/
            bin/ci-android-mono/*/project/*.cs
            bin/ci-android-mono/*/project/*.csproj
            bin/ci-android-mono/*/project/*.godot
            bin/ci-android-mono/*/project/*.tscn
            bin/ci-android-mono/*/project/*.png
            bin/ci-android-mono/*/project/*.import
            bin/ci-android-mono/*/project/global.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Save LTO template cache after a successful full build
        if: env.PACKAGE_BUILD == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .scons-cache/template
          key: windows-2022-${{ steps.prepare.outputs.image }}-x64-msvc143-extra-size-full-lto-v1-${{ hashFiles('SConstruct', 'platform/windows/detect.py', 'misc/build_profiles/windows_release_minimal_extra.py', '.github/ci/*.py', '.github/ci/smoke/*') }}-${{ github.sha }}
      - name: Stage editor, NuGet and LTO template archives with checksums
        if: env.PACKAGE_BUILD == 'true'
        run: python .github/ci/pipeline.py package
      - name: Upload tested build archives (no release or NuGet publication)
        if: env.PACKAGE_BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-msvc143-extra-lto-${{ github.sha }}
          path: bin/ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-msvc143-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: bin/ci-logs/
          if-no-files-found: warn
          retention-days: 7

  draft-release:
    name: Create tag release draft for manual review
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x64-msvc143-extra-lto-${{ github.sha }}
          path: bin/ci-artifacts
      - name: Verify provenance and upload to an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ci/draft_release.py
